<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Task App - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animated gradient background */
    .animated-bg {
      background: linear-gradient(135deg, #1f2937, #111827, #1f2937);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Glass effect for card */
    .glass {
      background: rgba(31, 41, 55, 0.75);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4">
  <div class="container mx-auto flex flex-col md:flex-row bg-gray-800 bg-opacity-75 rounded-xl shadow-2xl overflow-hidden">
    <!-- Left side: Info panel (only on larger screens) -->
    <div class="hidden md:flex md:w-1/2 items-center justify-center p-10">
      <div class="text-center">
        <h1 class="text-4xl font-bold text-white mb-4">Welcome to Task App</h1>
        <p class="text-lg text-gray-300">Stay organized and manage your tasks in style.</p>
      </div>
    </div>
    <!-- Right side: Login form -->
    <div class="w-full md:w-1/2 p-8">
      <h2 class="text-3xl font-extrabold text-white text-center mb-6">Login</h2>
      <div class="space-y-6">
        <div>
          <label for="email" class="block text-gray-300 font-semibold mb-1">Email</label>
          <input type="email" id="email" placeholder="Enter your email"
                 class="w-full px-4 py-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label for="password" class="block text-gray-300 font-semibold mb-1">Password</label>
          <input type="password" id="password" placeholder="Enter your password"
                 class="w-full px-4 py-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex space-x-4">
          <button id="signup-btn"
                  class="w-1/2 py-3 rounded-lg border border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-white transition">
            Sign Up
          </button>
          <button id="login-btn"
                  class="w-1/2 py-3 rounded-lg bg-blue-500 text-white hover:bg-blue-600 transition">
            Log In
          </button>
        </div>
      </div>
      <div id="auth-indicator" class="mt-6 text-center text-gray-300 font-medium">
        Not logged in
      </div>
      <button id="logout-btn" style="display:none;"
              class="mt-6 w-full py-3 rounded-lg bg-red-600 text-white hover:bg-red-700 transition">
        Logout
      </button>
    </div>
  </div>

  <!-- Import our Firebase module and attach functions to global scope -->
  <script type="module">
    import { signup, login, logout } from "/static/js/firebase-login.js";
    window.signup = signup;
    window.login = login;
    window.logout = logout;

    document.getElementById("signup-btn").addEventListener("click", signup);
    document.getElementById("login-btn").addEventListener("click", login);
    document.getElementById("logout-btn").addEventListener("click", logout);
  </script>
</body>
</html>
