<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Task App - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom styles for a glass effect on cards */
    .glass-card {
      background: rgba(31, 41, 55, 0.75);
      backdrop-filter: blur(8px);
    }
    /* Floating button style */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 50;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100">
  <!-- Sidebar Navigation -->
  <aside class="fixed inset-y-0 left-0 w-64 bg-gray-800 shadow-lg flex flex-col">
    <div class="p-6">
      <h2 class="text-3xl font-bold">Task App</h2>
    </div>
    <nav class="flex-1 px-4 space-y-2">
      <a href="/dashboard" class="block px-4 py-2 rounded hover:bg-gray-700">Dashboard</a>
      <a href="/profile" class="block px-4 py-2 rounded hover:bg-gray-700">Profile</a>
      <a href="/settings" class="block px-4 py-2 rounded hover:bg-gray-700">Settings</a>
    </nav>
    <div class="p-6">
      <button id="logout-btn" class="w-full bg-red-600 hover:bg-red-700 px-4 py-2 rounded">Logout</button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="pl-64">
    <!-- Header Bar -->
    <header class="bg-gray-800 p-4 shadow-md">
      <div class="container mx-auto flex justify-between items-center">
        <h1 id="auth-indicator" class="text-xl font-semibold">Not logged in</h1>
      </div>
    </header>

    <!-- Dashboard Content -->
    <main class="container mx-auto p-6">
      <div class="mb-6">
        <h2 class="text-3xl font-bold mb-2">My Boards</h2>
        <!-- You could add a subheader or counters here -->
      </div>
      <!-- Boards Grid -->
      <div id="boards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Board cards appended here -->
      </div>
    </main>
  </div>

  <!-- Floating Create Board Button -->
  <button id="create-board-btn" class="fab bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-xl">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
         xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4v16m8-8H4"></path>
    </svg>
  </button>

  <!-- Modal for Creating a New Board -->
  <div id="board-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="glass-card rounded-xl shadow-2xl p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4 text-white text-center">Create New Board</h2>
      <input type="text" id="board-name" placeholder="Board Name"
             class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition outline-none mb-4">
      <div class="flex justify-end space-x-4">
        <button id="cancel-board-btn" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded transition text-white">Cancel</button>
        <button id="submit-board-btn" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded transition">Create</button>
      </div>
    </div>
  </div>

  <!-- Firebase Auth & Board Creation Script -->
  <script type="module">
    import { logout } from "/static/js/firebase-login.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const auth = getAuth();
    const authIndicator = document.getElementById("auth-indicator");
    const logoutBtn = document.getElementById("logout-btn");
    const createBoardBtn = document.getElementById("create-board-btn");
    const boardModal = document.getElementById("board-modal");
    const cancelBoardBtn = document.getElementById("cancel-board-btn");
    const submitBoardBtn = document.getElementById("submit-board-btn");
    const boardNameInput = document.getElementById("board-name");
    const boardsGrid = document.getElementById("boards-grid");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authIndicator.textContent = `Logged in as ${user.email}`;
        window.currentUserId = user.uid;
        loadBoards();
      } else {
        authIndicator.textContent = "Not logged in";
      }
    });

    logoutBtn.addEventListener("click", logout);

    createBoardBtn.addEventListener("click", () => {
      boardModal.classList.remove("hidden");
    });

    cancelBoardBtn.addEventListener("click", () => {
      boardModal.classList.add("hidden");
      boardNameInput.value = "";
    });

    submitBoardBtn.addEventListener("click", async () => {
      const boardName = boardNameInput.value.trim();
      if (!boardName) {
        alert("Please enter a board name.");
        return;
      }

      const payload = {
        name: boardName,
        createdBy: window.currentUserId,
        members: [window.currentUserId]
      };

      try {
        const response = await fetch("/boards", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (response.ok) {
          addBoardCard({ id: data.id, name: boardName });
          boardModal.classList.add("hidden");
          boardNameInput.value = "";
        } else {
          alert("Error creating board: " + data.detail);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred while creating the board.");
      }
    });

    function addBoardCard(board) {
      const card = document.createElement("div");
      card.className = "glass-card rounded-xl shadow-lg p-6 hover:scale-105 transform transition";
      card.innerHTML = `
        <h2 class="text-xl font-bold mb-2 text-white">${board.name}</h2>
        <p class="text-gray-400 mb-4">Board ID: ${board.id}</p>
        <button class="view-board bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded transition" data-board-id="${board.id}">
          View Board
        </button>
      `;
      boardsGrid.appendChild(card);

      card.querySelector(".view-board").addEventListener("click", (e) => {
        const boardId = e.target.getAttribute("data-board-id");
        window.location.href = `/boards/${boardId}`;
      });
    }

    async function loadBoards() {
      try {
        const response = await fetch(`/boards?userId=${window.currentUserId}`);
        const boards = await response.json();
        boardsGrid.innerHTML = "";
        boards.forEach(board => addBoardCard(board));
      } catch (error) {
        console.error("Error loading boards:", error);
      }
    }
  </script>
</body>
</html>
