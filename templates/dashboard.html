<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Task App - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- You can customize your Tailwind config for dark mode if desired -->
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800">
  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Task App Dashboard</h1>
      <div class="flex items-center space-x-4">
        <span id="auth-indicator" class="text-sm text-gray-300">Not logged in</span>
        <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition">Logout</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto p-4">
    <!-- Create Board Button -->
    <div class="mb-6">
      <button id="create-board-btn" class="bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-lg transition">
        Create New Board
      </button>
    </div>

    <!-- Boards Grid -->
    <div id="boards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- New board cards will be appended here -->
    </div>
  </main>

  <!-- Modal for Creating a New Board -->
  <div id="board-modal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-gray-800 rounded-lg shadow-lg p-6 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4 text-white">Create New Board</h2>
      <input type="text" id="board-name" placeholder="Board Name"
             class="w-full px-4 py-3 rounded-lg border border-gray-600 bg-gray-700 text-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition duration-200 outline-none mb-4">
      <div class="flex justify-end space-x-4">
        <button id="cancel-board-btn" class="bg-gray-600 hover:bg-gray-500 px-4 py-2 rounded-lg transition text-white">Cancel</button>
        <button id="submit-board-btn" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg transition">Create</button>
      </div>
    </div>
  </div>

  <!-- Firebase Auth & Board Creation Script -->
  <script type="module">
    import { logout } from "/static/js/firebase-login.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const auth = getAuth();
    const authIndicator = document.getElementById("auth-indicator");
    const logoutBtn = document.getElementById("logout-btn");
    const createBoardBtn = document.getElementById("create-board-btn");
    const boardModal = document.getElementById("board-modal");
    const cancelBoardBtn = document.getElementById("cancel-board-btn");
    const submitBoardBtn = document.getElementById("submit-board-btn");
    const boardNameInput = document.getElementById("board-name");
    const boardsGrid = document.getElementById("boards-grid");

    // Update UI on auth state change and load boards for the logged-in user
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authIndicator.textContent = `Logged in as ${user.email}`;
        window.currentUserId = user.uid; // Save user ID globally
        loadBoards();
      } else {
        authIndicator.textContent = "Not logged in";
      }
    });

    logoutBtn.addEventListener("click", logout);

    // Show the modal when the create board button is clicked
    createBoardBtn.addEventListener("click", () => {
      boardModal.classList.remove("hidden");
    });

    // Hide the modal on cancel
    cancelBoardBtn.addEventListener("click", () => {
      boardModal.classList.add("hidden");
      boardNameInput.value = "";
    });

    // Handle board creation on form submission
    submitBoardBtn.addEventListener("click", async () => {
      const boardName = boardNameInput.value.trim();
      if (!boardName) {
        alert("Please enter a board name.");
        return;
      }

      // Prepare payload for board creation
      const payload = {
        name: boardName,
        createdBy: window.currentUserId,
        members: [window.currentUserId]
      };

      try {
        const response = await fetch("/boards", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (response.ok) {
          // Append the new board to the UI
          addBoardCard({ id: data.id, name: boardName });
          boardModal.classList.add("hidden");
          boardNameInput.value = "";
        } else {
          alert("Error creating board: " + data.detail);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred while creating the board.");
      }
    });

    // Append a board card to the boards grid
    function addBoardCard(board) {
      const card = document.createElement("div");
      card.className = "bg-gray-800 rounded-lg shadow p-6";
      card.innerHTML = `
        <h2 class="text-xl font-bold mb-2 text-white">${board.name}</h2>
        <p class="text-gray-400 mb-4">Board ID: ${board.id}</p>
        <div class="flex justify-between">
          <button class="view-board bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded transition" data-board-id="${board.id}">
            View
          </button>
          <button class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition">Edit</button>
        </div>
      `;
      boardsGrid.appendChild(card);

      // Add event listener for the view button
      card.querySelector(".view-board").addEventListener("click", (e) => {
        const boardId = e.target.getAttribute("data-board-id");
        // Navigate to the board details page
        window.location.href = `/boards/${boardId}`;
      });
    }

    // Load boards visible to the current user
    async function loadBoards() {
      try {
        const response = await fetch(`/boards?userId=${window.currentUserId}`);
        const boards = await response.json();
        boardsGrid.innerHTML = ""; // Clear current boards
        boards.forEach(board => addBoardCard(board));
      } catch (error) {
        console.error("Error loading boards:", error);
      }
    }
  </script>
</body>
</html>
